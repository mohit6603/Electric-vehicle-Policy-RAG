[project]
name = "electric-vehicle-policy-rag"
version = "0.1.0"
description = "EV policy assistant for the Generative AI mini-project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.0.20",
    "gradio==5.31.0",
    "langchain==0.3.25",
    "langchain-chroma==0.2.6",
    "langchain-community==0.3.24",
    "langchain-core==0.3.76",
    "langchain-groq==0.3.8",
    "langchain-ollama==0.3.7",
    "langchain-text-splitters==0.3.8",
    "pypdf==6.1.1",
    "python-dotenv==1.1.0",
    "unstructured==0.18.14",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "ipywidgets==8.1.7",
    "jupyterlab==4.4.7",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
]
